<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background-color: #0b1120; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="domainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="repoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="575" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Diagrama de Componentes (C4 - Nivel 3)</text>
  <text x="575" y="62" text-anchor="middle" fill="#94a3b8" font-size="14">Descomposición del Módulo de Inscripciones y Control de Cupos</text>
  <line x1="80" y1="80" x2="1070" y2="80" stroke="#334155" stroke-width="1"/>

  <!-- Boundary: Backend API Container -->
  <rect x="70" y="100" width="1010" height="560" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" opacity="0.95"/>
  <text x="90" y="125" fill="#60a5fa" font-size="13" font-weight="700">Contenedor: Servicio Central PIA (Monolito Modular con Arquitectura Limpia)</text>

  <!-- Request from Nginx -->
  <g transform="translate(100, 160)">
    <text x="0" y="25" fill="#38bdf8" font-size="11" font-weight="700">POST /api/v1/inscripciones</text>
    <text x="0" y="40" fill="#94a3b8" font-size="10">Header: Idempotency-Key</text>
    <path d="M 170 30 L 220 30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Component 1: IdempotencyFilter (Escenario B) -->
  <g transform="translate(230, 150)" filter="url(#shadow)">
    <rect width="220" height="110" rx="10" fill="url(#secGrad)" stroke="#f87171" stroke-width="2"/>
    <text x="110" y="22" text-anchor="middle" fill="#fecaca" font-size="9" font-weight="600">[Componente: Seguridad / Concurrencia]</text>
    <text x="110" y="44" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">IdempotencyGuard</text>
    <line x1="15" y1="52" x2="205" y2="52" stroke="#ef4444" stroke-width="1"/>
    <text x="110" y="70" text-anchor="middle" fill="#fee2e2" font-size="9">Filtra reintentos repetidos (hasta 5 clics)</text>
    <text x="110" y="85" text-anchor="middle" fill="#fee2e2" font-size="9">Verifica y bloquea token en Redis</text>
    <text x="110" y="100" text-anchor="middle" fill="#fef08a" font-size="9" font-weight="600">Mitiga Escenario B (Concurrencia)</text>
  </g>

  <!-- Component 2: InscripcionController -->
  <g transform="translate(500, 150)" filter="url(#shadow)">
    <rect width="210" height="110" rx="10" fill="url(#compGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="105" y="22" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">[Componente: Controlador REST]</text>
    <text x="105" y="44" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">InscripcionController</text>
    <line x1="15" y1="52" x2="195" y2="52" stroke="#3b82f6" stroke-width="1"/>
    <text x="105" y="70" text-anchor="middle" fill="#e2e8f0" font-size="9">Valida DTO de entrada y sesión JWT</text>
    <text x="105" y="85" text-anchor="middle" fill="#e2e8f0" font-size="9">Maneja códigos HTTP (200, 409, 422)</text>
    <text x="105" y="100" text-anchor="middle" fill="#93c5fd" font-size="9">Entrega respuesta estandarizada</text>
  </g>

  <!-- Component 3: InscripcionService (Orquestador) -->
  <g transform="translate(360, 310)" filter="url(#shadow)">
    <rect width="260" height="130" rx="10" fill="url(#compGrad)" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="130" y="22" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">[Componente: Caso de Uso / Orquestador]</text>
    <text x="130" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">InscripcionService</text>
    <line x1="20" y1="52" x2="240" y2="52" stroke="#3b82f6" stroke-width="1"/>
    <text x="130" y="70" text-anchor="middle" fill="#e2e8f0" font-size="9">Orquesta la transacción de matrícula:</text>
    <text x="130" y="86" text-anchor="middle" fill="#e2e8f0" font-size="9">1. Valida reglas académicas locales</text>
    <text x="130" y="102" text-anchor="middle" fill="#e2e8f0" font-size="9">2. Solicita reserva atómica de cupo</text>
    <text x="130" y="118" text-anchor="middle" fill="#e2e8f0" font-size="9">3. Publica evento en Outbox y Auditoría</text>
  </g>

  <!-- Component 4: MotorReglasPrerrequisitos (Domain Core) -->
  <g transform="translate(90, 310)" filter="url(#shadow)">
    <rect width="230" height="130" rx="10" fill="url(#domainGrad)" stroke="#c084fc" stroke-width="2"/>
    <text x="115" y="22" text-anchor="middle" fill="#e9d5ff" font-size="9" font-weight="600">[Componente: Dominio / Lógica Pura]</text>
    <text x="115" y="44" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">MotorReglasPrerrequisitos</text>
    <line x1="15" y1="52" x2="215" y2="52" stroke="#a855f7" stroke-width="1"/>
    <text x="115" y="70" text-anchor="middle" fill="#f3e8ff" font-size="9">Evalúa prerrequisitos de la malla</text>
    <text x="115" y="85" text-anchor="middle" fill="#f3e8ff" font-size="9">Detecta solapamientos de horario</text>
    <text x="115" y="100" text-anchor="middle" fill="#f3e8ff" font-size="9">Controla topes de créditos permitidos</text>
    <text x="115" y="116" text-anchor="middle" fill="#a7f3d0" font-size="8">100% Autónomo (Snapshot local C05)</text>
  </g>

  <!-- Component 5: GestorCupos (Seat Booking Manager) -->
  <g transform="translate(670, 310)" filter="url(#shadow)">
    <rect width="250" height="130" rx="10" fill="url(#repoGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="125" y="22" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="600">[Componente: Concurrencia Crítica]</text>
    <text x="125" y="44" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">GestorCupos (Seat Manager)</text>
    <line x1="15" y1="52" x2="235" y2="52" stroke="#10b981" stroke-width="1"/>
    <text x="125" y="70" text-anchor="middle" fill="#d1fae5" font-size="9">Asegura CERO SOBRECUPO (C04)</text>
    <text x="125" y="86" text-anchor="middle" fill="#d1fae5" font-size="9">UPDATE atómico condicional en PG:</text>
    <text x="125" y="102" text-anchor="middle" fill="#fef08a" font-size="8">cupos = cupos - 1 WHERE cupos &gt; 0</text>
    <text x="125" y="118" text-anchor="middle" fill="#6ee7b7" font-size="8">Sin bloqueos de tabla prolongados</text>
  </g>

  <!-- Transaction Boundary Box -->
  <rect x="230" y="475" width="700" height="165" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" opacity="0.85"/>
  <text x="250" y="497" fill="#6ee7b7" font-size="12" font-weight="700">Límite Transaccional ACID en PostgreSQL (Atomic Commit / Rollback)</text>

  <!-- Component 6: InscripcionRepository -->
  <g transform="translate(250, 510)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="url(#repoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="600">[Repositorio Persistencia]</text>
    <text x="100" y="40" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">InscripcionRepository</text>
    <line x1="10" y1="48" x2="190" y2="48" stroke="#10b981" stroke-width="1"/>
    <text x="100" y="65" text-anchor="middle" fill="#d1fae5" font-size="8">Inserta registro de inscripción</text>
    <text x="100" y="80" text-anchor="middle" fill="#d1fae5" font-size="8">Estado: PENDIENTE_SINC</text>
    <text x="100" y="96" text-anchor="middle" fill="#fef08a" font-size="8">UNIQUE(estudiante, grupo, periodo)</text>
  </g>

  <!-- Component 7: OutboxPublisher -->
  <g transform="translate(480, 510)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="url(#compGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">[Componente Eventos]</text>
    <text x="100" y="40" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">OutboxPublisher</text>
    <line x1="10" y1="48" x2="190" y2="48" stroke="#3b82f6" stroke-width="1"/>
    <text x="100" y="65" text-anchor="middle" fill="#e2e8f0" font-size="8">Inserta evento en tabla Outbox</text>
    <text x="100" y="80" text-anchor="middle" fill="#e2e8f0" font-size="8">Garantiza entrega exactly-once</text>
    <text x="100" y="96" text-anchor="middle" fill="#a7f3d0" font-size="8">Misma transacción que cupo</text>
  </g>

  <!-- Component 8: AuditLogger -->
  <g transform="translate(710, 510)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="url(#compGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">[Componente Auditoría C09]</text>
    <text x="100" y="40" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">AuditLogger</text>
    <line x1="10" y1="48" x2="190" y2="48" stroke="#3b82f6" stroke-width="1"/>
    <text x="100" y="65" text-anchor="middle" fill="#e2e8f0" font-size="8">Genera log inmutable en PG</text>
    <text x="100" y="80" text-anchor="middle" fill="#e2e8f0" font-size="8">IP, User-Agent, Timestamp ISO</text>
    <text x="100" y="96" text-anchor="middle" fill="#e2e8f0" font-size="8">Cumplimiento Ley 1581</text>
  </g>

  <!-- Internal Connections -->
  <!-- Guard -> Controller -->
  <path d="M 450 205 L 500 205" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="198" text-anchor="middle" fill="#38bdf8" font-size="8">Pasa validado</text>

  <!-- Controller -> Service -->
  <path d="M 605 260 L 510 310" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="285" fill="#38bdf8" font-size="8">Invoca caso uso</text>

  <!-- Service -> Rules -->
  <path d="M 360 375 L 320 375" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="340" y="365" text-anchor="middle" fill="#c084fc" font-size="8">Valida</text>

  <!-- Service -> Seat Manager -->
  <path d="M 620 375 L 670 375" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="645" y="365" text-anchor="middle" fill="#34d399" font-size="8">Reserva</text>

  <!-- Service -> Transaction Boundary -->
  <path d="M 490 440 L 490 475" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="500" y="460" fill="#34d399" font-size="8">Tx BEGIN</text>

  <!-- Bottom Legend -->
  <g transform="translate(180, 690)">
    <rect width="800" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="400" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Garantía del Límite Transaccional:</text>
    <text x="400" y="44" text-anchor="middle" fill="#94a3b8" font-size="11">
      El decremento de cupo, el registro de inscripción y el evento Outbox se confirman en una sola transacción local ACID.
    </text>
  </g>
</svg>
